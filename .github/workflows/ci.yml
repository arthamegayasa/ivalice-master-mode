name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/Ivalice.Core.Tests --nologo
      - run: dotnet test tests/Ivalice.Battle.Tests --nologo
      - run: dotnet build src/Ivalice.ControlCenter -c Release --nologo
      - name: Build Smart Auto Battle
        run: dotnet build mods/ivalice.battle.smartautobattle -c Release --nologo
        env:
          RELOADEDIIMODS: ${{ runner.temp }}\mods
